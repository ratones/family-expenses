    <div class="users-container">
      <h2>Users</h2>

      <dx-button
        text="Add User"
        type="default"
        icon="plus"
        (onClick)="showAddPopup()"
        style="margin-bottom: 1rem;">
      </dx-button>

      <dx-data-grid
        #dataGrid
        [dataSource]="users()"
        [columns]="columns"
        [showBorders]="true"
        [allowColumnReordering]="true"
        [allowColumnResizing]="true"
        [columnAutoWidth]="true"
        [showColumnLines]="true"
        [showRowLines]="true"
        [rowAlternationEnabled]="true"
        [hoverStateEnabled]="true"
        [selection]="{ mode: 'single' }"
        (onToolbarPreparing)="onToolbarPreparing($event)">
      </dx-data-grid>

      <dx-popup
        [visible]="popupVisible()"
        [title]="isEditing() ? 'Edit User' : 'Add User'"
        [width]="500"
        [height]="350"
        (onHiding)="hidePopup()">
        <dx-form
          [formData]="currentUser()"
          [colCount]="1"
          [showColonAfterLabel]="true">
          <dxi-item
            dataField="id"
            [label]="{ text: 'ID' }"
            [editorOptions]="{ placeholder: 'e.g., john, jane' }">
          </dxi-item>
          <dxi-item
            dataField="name"
            [label]="{ text: 'Name' }"
            [editorOptions]="{ placeholder: 'e.g., John Doe, Jane Smith' }">
          </dxi-item>
          <dxi-item
            dataField="isActive"
            [label]="{ text: 'Active' }"
            editorType="dxCheckBox">
          </dxi-item>
        </dx-form>

        <dxi-popup-toolbar-item
          widget="dxButton"
          location="after"
          [options]="{
            text: 'Save',
            type: 'default',
            onClick: saveUser
          }">
        </dxi-popup-toolbar-item>
        <dxi-popup-toolbar-item
          widget="dxButton"
          location="after"
          [options]="{
            text: 'Cancel',
            onClick: hidePopup
          }">
        </dxi-popup-toolbar-item>
      </dx-popup>
    </div>
